[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vasp-lsp"
version = "0.4.4"
description = "Language Server Protocol for VASP input files"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "VASP-LSP Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "pygls>=1.2.0,<2.0.0",
    "lsprotocol>=2023.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0,<2.0",
]

[project.scripts]
vasp-lsp = "vasp_lsp.server:main"
vasp-lsp-tool = "vasp_lsp.tool:main"
vasp-lsp-check = "vasp_lsp.tool:check_main"
vasp-lsp-explain = "vasp_lsp.tool:explain_main"
vasp-lsp-describe = "vasp_lsp.tool:describe_main"
vasp-lsp-schema = "vasp_lsp.tool:schema_main"
vasp-lsp-examples = "vasp_lsp.tool:examples_main"

[tool.hatch.build.targets.wheel]
packages = ["src/vasp_lsp"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
follow_imports = "skip"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
markers = [
    "slow: performance benchmarks (deselect with '-m \"not slow\"')",
    "integration: integration tests that exercise LSP protocol messages",
]

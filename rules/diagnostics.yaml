# VASP-LSP diagnostic rule manifest (Diagnostic Engine v1).
#
# This file is the published export of vasp_lsp.rules.RULES_MANIFEST. It is
# consumed by OpenQC and other tooling that needs the rule catalog without
# importing the Python package. The body is strict JSON (a YAML subset) so
# it can be parsed without a YAML dependency.
#
# Keep this file in sync with src/vasp_lsp/rules.py.
#
# Upstream reference: https://www.vasp.at/wiki/index.php/INCAR
{
  "diagnostic_engine": "1.0",
  "software": "vasp",
  "rules": [
    {
      "rule_id": "vasp.incar.invalid_tag",
      "software": "vasp",
      "severity": "error",
      "category": "schema",
      "confidence": 1.0,
      "source": "official",
      "summary": "Reports INCAR tags that are not part of the upstream VASP INCAR schema. Such tags are silently ignored by VASP and almost always indicate a typo or a stale parameter name.",
      "manual_ref": "https://www.vasp.at/wiki/index.php/INCAR",
      "fix_hint": "Remove the unknown tag or replace it with a valid INCAR tag (see https://www.vasp.at/wiki/index.php/INCAR)."
    },
    {
      "rule_id": "vasp.incar.invalid_value",
      "software": "vasp",
      "severity": "error",
      "category": "schema",
      "confidence": 1.0,
      "source": "official",
      "summary": "Reports INCAR tags whose value does not match the tag's declared type (e.g. a non-numeric string where the upstream schema expects an integer or float, or a string where a boolean is required). Such values are rejected or silently misinterpreted by VASP.",
      "manual_ref": "https://www.vasp.at/wiki/index.php/INCAR",
      "fix_hint": "Replace the value with one matching the tag's declared type (see https://www.vasp.at/wiki/index.php/INCAR)."
    },
    {
      "rule_id": "vasp.spin.missing_magmom",
      "software": "vasp",
      "severity": "warning",
      "category": "semantic consistency",
      "confidence": 0.9,
      "source": "official",
      "summary": "Reports spin-polarized calculations (ISPIN=2) that do not declare an initial set of magnetic moments via MAGMOM. Without MAGMOM, VASP defaults the moments to unity, which almost always indicates a forgotten keyword in a spin workflow.",
      "manual_ref": "https://www.vasp.at/wiki/index.php/MAGMOM",
      "fix_hint": "Add a MAGMOM tag matching your species/atom counts (see https://www.vasp.at/wiki/index.php/MAGMOM), or set ISPIN=1 if the calculation is not meant to be spin-polarized."
    },
    {
      "rule_id": "vasp.smearing.ismear_sigma_mismatch",
      "software": "vasp",
      "severity": "warning",
      "category": "semantic consistency",
      "confidence": 0.9,
      "source": "official",
      "summary": "Reports an inconsistency between ISMEAR and SIGMA. For ISMEAR >= 0 (Gaussian or Methfessel-Paxton smearing) SIGMA sets the smearing width and should be declared explicitly; for ISMEAR < 0 (tetrahedron method) SIGMA is unused and should be omitted. A mismatch almost always indicates a forgotten or stray keyword in the smearing setup.",
      "manual_ref": "https://www.vasp.at/wiki/index.php/ISMEAR",
      "fix_hint": "Pair ISMEAR with an explicit SIGMA width for ISMEAR >= 0 (see https://www.vasp.at/wiki/index.php/SIGMA), or remove SIGMA when ISMEAR < 0 selects the tetrahedron method."
    },
    {
      "rule_id": "vasp.encut.below_enmax",
      "software": "vasp",
      "severity": "warning",
      "category": "semantic consistency",
      "confidence": 0.9,
      "source": "official",
      "summary": "Reports an INCAR ENCUT value below the maximum ENMAX found in the neighbouring POTCAR evidence. Each pseudopotential dataset is shipped with a recommended plane-wave cutoff (ENMAX); running ENCUT below the largest of these degrades the basis set the pseudopotentials were balanced for and almost always indicates a too-low cutoff for the calculation.",
      "manual_ref": "https://www.vasp.at/wiki/index.php/ENCUT",
      "fix_hint": "Raise ENCUT to at least the largest POTCAR ENMAX (see https://www.vasp.at/wiki/index.php/ENCUT), or ~1.3 x ENMAX for production accuracy."
    },
    {
      "rule_id": "vasp.parallel.ncore_npar_conflict",
      "software": "vasp",
      "severity": "warning",
      "category": "semantic consistency",
      "confidence": 0.9,
      "source": "official",
      "summary": "Reports INCAR files that declare both NCORE and NPAR. The two flags are mutually-exclusive parallelism controls: NCORE sets the number of cores working on a single orbital and NPAR sets the number of parallel band groups; VASP derives one from the other, so declaring both is contradictory and almost always indicates a copy-paste from two different parallelization recipes.",
      "manual_ref": "https://www.vasp.at/wiki/index.php/NCORE",
      "fix_hint": "Remove NPAR and keep NCORE for parallelization control (see https://www.vasp.at/wiki/index.php/NCORE and https://www.vasp.at/wiki/index.php/NPAR); VASP derives NPAR from NCORE automatically."
    }
  ]
}
